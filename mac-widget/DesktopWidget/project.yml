name: WaveHastingsDesktop
options:
  bundleIdPrefix: com.anonymous.hastings-tide
  deploymentTarget:
    macOS: "14.0"

targets:
  WaveHastingsDesktop:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anonymous.hastings-tide.desktop
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Wave Hastings
        LSUIElement: false
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/WaveHastingsDesktop.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.anonymous.hastings-tide
    dependencies:
      - target: WaveHastingsWidgetExtension
        embed: true
        codeSign: true

  WaveHastingsWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anonymous.hastings-tide.desktop.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Wave Hastings Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/WaveHastingsWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.anonymous.hastings-tide

schemes:
  WaveHastingsDesktop:
    build:
      targets:
        WaveHastingsDesktop: all
    run:
      config: Debug
