<!DOCTYPE html>
<!-- biome-ignore lint/a11y/useValidLang: this is Expo's own build-time lang placeholder, substituted with a real code before this ever ships -->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Lets the status bar (time/battery) blend into the page background
         instead of showing an opaque bar, both when browsing normally and
         when saved to the iOS Home Screen as a standalone app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hastings Pier" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #03122b;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Without this, padding-top below adds to the 100% height instead of
           being carved out of it, so the box overflows the viewport and
           overflow:hidden silently clips content off the bottom. */
        box-sizing: border-box;
        /* With status-bar-style=black-translucent, content draws under the
           status bar/notch — pad it back out using the safe-area inset that
           viewport-fit=cover unlocks, so nothing sits behind it. Capped
           since the standalone (home screen) inset reports well beyond the
           actual status bar height, leaving an oversized gap up top. */
        padding-top: min(env(safe-area-inset-top), 24px);
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
